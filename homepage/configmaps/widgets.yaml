apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-widgets
  namespace: default
  labels:
    app.kubernetes.io/name: homepage
data:
  content: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: false
    - openweathermap:
        label: Singapore #optional
        latitude: 1.3838947254312357
        longitude: 103.83642952530914
        units: metric # or imperial
        provider: openweathermap
        apiKey: {{HOMEPAGE_VAR_OWM}} # required only if not using provider, this reveals api key in requests
        cache: 5 # Time in minutes to cache API responses, to stay within limits
        format: # optional, Intl.NumberFormat options
          maximumFractionDigits: 1
