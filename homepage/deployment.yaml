apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: default
  labels:
    app.kubernetes.io/name: homepage
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.13.2
          imagePullPolicy: Always
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: homepage.mrchoc.net
            - name: HOMEPAGE_PROXY_DISABLE_IPV6
              value: "true"
          envFrom:
            - secretRef:
                name: homepage-secret
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - mountPath: /app/config/bookmarks.yaml
              name: homepage-config-bookmarks
              subPath: content
            - mountPath: /app/config/docker.yaml
              name: homepage-config-docker
              subPath: content
            - mountPath: /app/config/kubernetes.yaml
              name: homepage-config-kubernetes
              subPath: content
            - mountPath: /app/config/services.yaml
              name: homepage-config-services
              subPath: content
            - mountPath: /app/config/settings.yaml
              name: homepage-config-settings
              subPath: content
            - mountPath: /app/config/widgets.yaml
              name: homepage-config-widgets
              subPath: content
            - mountPath: /app/config/logs
              name: logs
      volumes:
        - name: logs
          emptyDir: {}
        - name: homepage-config-settings
          configMap:
            name: homepage-settings
        - name: homepage-config-kubernetes
          configMap:
            name: homepage-kubernetes
        - name: homepage-config-bookmarks
          configMap:
            name: homepage-bookmarks
        - name: homepage-config-services
          configMap:
            name: homepage-services
        - name: homepage-config-widgets
          configMap:
            name: homepage-widgets
        - name: homepage-config-docker
          configMap:
            name: homepage-docker
