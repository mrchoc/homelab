apiVersion: v1
kind: Service
metadata:
  name: teslamate-lb
  namespace: teslamate
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerIP: 192.168.1.243
  selector:
    app: teslamate
  ports:
    - name: backend
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: web-interface
      port: 4000
      targetPort: 4000
      protocol: TCP
    - name: grafana
      port: 3000
      targetPort: 3000
      protocol: TCP
    - name: mqtt
      port: 1883
      targetPort: 1883
      protocol: TCP
